        const topics = ["Emotional Reconciliation", "Challanges of Growing", "Motherhood and Care", "Financial Transactions", "School Rivalry", "Noble Lineage", "Little Animals", "Fantastic Adventure", "Military Engagements", "Time and Reflection", "Geological Evolution", "Darkness and Light", "Survival in the Wild", "Heroic Combat", "Family Dynamics", "Nautical Adventures"];
        const colors = ["#1f77b4", "#aec7e8", "#ff7f0e", "#ffbb78", "#2ca02c", "#98df8a", "#d62728", "#ff9896", "#9467bd", "#c5b0d5", "#8c564b", "#c49c94", "#e377c2", "#f7b6d2", "#7f7f7f", "#c7c7c7"];       

        // Initialize with all topics selected
        updateChart();

        function getSelectedTopics() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        function selectAllTopics() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = true);
            updateChart();
        }

        function clearAllTopics() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);
            updateChart();
        }

        function updateChart() {
            const selectedTopics = getSelectedTopics();

            if (selectedTopics.length === 0) {
                const layout = {
                    title: "Please select at least one topic",
                    xaxis: {title: "Relevance"},
                    yaxis: {title: "Book ID"},
                    height: 400
                };
                Plotly.newPlot('plotly-div', [], layout);
                return;
            }

            // Transform data to long format
            const longData = [];
            rawData.forEach(row => {
                selectedTopics.forEach(topic => {
                    if (row[topic] !== undefined && row[topic] !== null) {
                        longData.push({
                            book_id: row.book_id,
                            topic: topic,
                            relevance: row[topic]
                        });
                    }
                });
            });

            // Calculate total relevance per book for sorting
            const bookTotals = {};
            longData.forEach(item => {
                if (!bookTotals[item.book_id]) {
                    bookTotals[item.book_id] = 0;
                }
                bookTotals[item.book_id] += item.relevance;
            });

            // Sort books by total relevance (descending)
            var sortedBooks = Object.entries(bookTotals)
              .map(([key, value]) => [key, Number(value.toFixed(4))])
              .sort((a, b) => {
                    if (b[1] !== a[1]) return b[1] - a[1];
                    return a[0].localeCompare(b[0]);
                  })
                .map(([key]) => key);                   

            // Create traces for each topic
            const traces = [];
            selectedTopics.forEach((topic, index) => {
                const topicData = longData.filter(item => item.topic === topic);
                const x = [];
                const y = [];
                const text = [];

                sortedBooks.forEach(bookId => {
                    const item = topicData.find(d => d.book_id === bookId);
                    const relevance = item ? item.relevance : 0;
                    x.push(relevance);
                    y.push(bookId);
                    text.push(`${topic}: ${relevance.toFixed(2)}`);
                });

                traces.push({
                    x: x,
                    y: y,
                    text: text,
                    name: topic,
                    type: 'bar',
                    orientation: 'h',
                    marker: {
                        color: colors[index % colors.length]
                    },
                    hovertemplate: '<b>%{y}</b><br>%{text}<br><extra></extra>'
                });
            });

            const layout = {
                title: `Books sorted by total relevance`,
                xaxis: {
                    title: 'Relevance'
                },
                yaxis: {
                    title: 'Book ID',
                    categoryorder: 'array',
                    categoryarray: sortedBooks.reverse()
                },
                barmode: 'stack',
                height: 1400,
                margin: {l: 150, r: 50, t: 100, b: 50},
                hovermode: 'closest'
            };

            Plotly.newPlot('plotly-div', traces, layout);
        }
